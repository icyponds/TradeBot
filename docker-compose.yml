  #   image: tradebot:latest
  #   container_name: tradebot-sentiment
  #   restart: always
  #   command: ["python", "src/main.py", "--profile", "sentiment"]
  #   volumes:
  #     - ./src:/app/src
  #     - ./data:/app/data
  #     - ./logs:/app/logs
  #   env_file:
  #     - .env
  #   environment:
  #     - PYTHONUNBUFFERED=1
  #     - HYPERLIQUID_SUBACCOUNT_ADDRESS=0xyour_subaccount_address
